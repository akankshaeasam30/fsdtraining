<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-7">
            <div class="card rounded-5 bg-info">
                <div class="card-header  text-white text-center me-0 bg-warning rounded-4">
                    <h2>Student Registration</h2>
                </div>
                <div class="card-body">
                <form class="needs-validation" >
                    <div class="mb-3">
                    <label class="form-label text-white boder-outline-primary  shadow-lg">Full name</label>
                    <input type="text"
                        class="form-control"
                        placeholder="Enter your full name"
                        required>
                    <div class="invalid-feedback">
                        please enter your full name
                    </div>
                    </div>
                    <div class="mb-3">
                    <label class="form-label text-white  shadow-lg">Roll no</label>
                    <input type="text"
                        class="form-control border border-2 border-info"
                        placeholder="Enter your Roll number"
                        required >
                    </div>
                    <div class="mb-3">
                    <label class="form-label text-white  shadow-lg">Email</label>
                    <input type="email"
                        class="form-control border border-2 border-info"
                        placeholder="@gmail.com"
                        required >
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white  shadow-lg">Mobile Number</label>
                        <input type="tel"
                            class="form-control"
                            pattern="[0-9]{10}"
                            placeholder="+91"
                            required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white  shadow-lg">Gender</label>
                        <select class="form-select" required>
                            <option value="">Select option</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white  shadow-lg">Select branch</label>
                        <select class="form-select" required>
                            <option value="">Select option</option>
                            <option>CSE</option>
                            <option>ECE</option>
                            <option>CSM</option>
                            <option>AIML</option>
                            <option>DS</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white  shadow-lg">Date of Birth</label>
                        <input type="date"
                            class="form-control"
                            required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white  shadow-lg">Address</label>
                        <textarea 
                            class="form-control"
                            rows="3"
                            placeholder="Enter address"
                            required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white  shadow-lg">Upload Photo</label>
                        <input type="file"
                            class="form-control"
                            required>
                    </div>
                    <div class="text-center">
                        <button class="btn btn-outline-success"
                        type="submit">Submit</button>
                        <button class="btn btn-outline-danger"
                        type="submit">Reset</button>
                    </div>
                </form>
                
                </div>
            </div>
        </div>
        
        </div>

    </div>
    
    
</body>
</html>
