<!-- Registration Form -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">
                    <h3>Event Registration</h3>
                </div>

                <div class="card-body">

                    <!-- Success Alert -->

                    <div class="alert alert-success">
                        Register here for CVR Fest 2026.
                    </div>

                    <form>

                        <!-- Student Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Student Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter your name"
                                   required>

                        </div>

                        <!-- Roll Number -->

                        <div class="mb-3">

                            <label class="form-label">
                                Roll Number
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter roll number"
                                   required>

                        </div>

                        <!-- Branch -->

                        <div class="mb-3">

                            <label class="form-label">
                                Branch
                            </label>

                            <select class="form-select" required>

                                <option value="">
                                    Select Branch
                                </option>

                                <option>CSE</option>
                                <option>ECE</option>
                                <option>EEE</option>
                                <option>MECH</option>
                                <option>CIVIL</option>
                                <option>AIML</option>

                            </select>

                        </div>

                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   placeholder="Enter email"
                                   required>

                        </div>

                        <!-- Mobile -->

                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   placeholder="Enter mobile number"
                                   required>

                        </div>

                        <!-- Event Selection -->

                        <div class="mb-3">

                            <label class="form-label">
                                Select Event
                            </label>

                            <select class="form-select" required>

                                <option value="">
                                    Choose Event
                                </option>

                                <option>Technical Quiz</option>
                                <option>Hackathon</option>
                                <option>Poster Presentation</option>
                                <option>Coding Contest</option>
                                <option>Project Expo</option>
                                <option>Cultural Fest</option>

                            </select>

                        </div>

                        <!-- Buttons -->

                        <div class="text-center">

                            <button type="submit"
                                    class="btn btn-success">
                                Submit
                            </button>

                            <button type="reset"
                                    class="btn btn-danger">
                                Reset
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>
    <div class="alert alert-success d-none" id="successMsg">
    Registration Successful!
</div>

</div>
