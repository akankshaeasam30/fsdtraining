<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        text-align:center;
        box-sizing: border-box;
        padding: 10px;
        margin:10px;
    }
    header{
        border: 3px solid palevioletred;
        background-color: aliceblue;
    }
    nav{
        border:3px solid olive;
        background-color:blanchedalmond;
    }
    .container{
        display: flex;
    }
    .content{
         border: 4px solid black;
            padding: 10px;
            width: 1000px;
            margin: auto;
            background-color: gainsboro;
    }
    main{
        width: 75%;
        border:3px solid rebeccapurple;
        background-color: chartreuse;
    }
    article{
        border:3px solid sienna;
        background-color: cornsilk;
    }
    figure{
        border:3px solid purple;
        background-color: burlywood;
    }
    p{
        border:3px solid rgb(251, 14, 61);
        background-color: rgb(234, 239, 177);
    }
    aside{
        width: 25%;
        border:3px solid rgb(13, 39, 208);
        background-color: rgb(232, 206, 172);
    }
    footer{
        border:3px solid purple;
        background-color: burlywood;
    }


</style>
<body>
    <div class="content">
    <header>
        Header
    </header>
    <nav>
        NavBar
    </nav>
    <div class="container">
    <main>
        main
        <article>
            article
        </article>
        <figure>
            figure
        </figure>
        <p>
            paragraph
        </p>
    </main>
    <aside>
        aside
    </aside>
    </div>
    <footer>
        footer
    </footer>
    </div>
</body>
</html>
